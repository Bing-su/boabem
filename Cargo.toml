[package]
name = "boabem"
version = "0.3.2"
edition = "2024"
description = "Python bindings for the Rust crate 'boa', an embeddable JavaScript engine"
readme = "README.md"
repository = "https://github.com/Bing-su/boabem"
license = "MIT or Apache-2.0"
categories = ["pyo3"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib"]
name = "boabem"

[dependencies]
boa_engine = {
  version = "~0.22.0",
  features = [
    "annex-b",
    "embedded_lz4",
    "flowgraph",
    "intl_bundled",
    "js",
    "native-backtrace",
    "system-time-zone",
    "trace",
  ]
}
boa_runtime = { version = "~0.22.0", features = ["all"] }
num-bigint = "0.4"
num-traits = "0.2"
pyo3 = { version = "0.29", features = ["num-bigint"] }
reqwest = "0.13"

[features]
abi3 = ["pyo3/abi3-py310"]
abi3t = ["pyo3/abi3t-py315"]

[profile.release]
split-debuginfo = "packed"
strip = true
lto = true
codegen-units = 1
