name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    name: Build Wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux - manylinux
          - os: ubuntu-latest
            manylinux: auto
            target: x86_64-unknown-linux-gnu
            args: --out dist --zig
            interpreter: -i 3.10 3.14t pypy3.11 graalpy3.12
            abi3t: true
          - os: ubuntu-24.04-arm
            manylinux: auto
            target: aarch64-unknown-linux-gnu
            args: --out dist --zig
            interpreter: -i 3.10 3.14t pypy3.11 graalpy3.12
            abi3t: true
          - os: ubuntu-latest
            manylinux: auto
            target: riscv64gc-unknown-linux-gnu
            args: --out dist --zig
            interpreter: -i 3.10 3.14t
            abi3t: true

          # Linux - musllinux
          - os: ubuntu-latest
            manylinux: musllinux_1_2
            target: x86_64-unknown-linux-musl
            args: --out dist --zig
            interpreter: -i 3.10 3.14t
            abi3t: true
          - os: ubuntu-26.04-arm
            manylinux: musllinux_1_2
            target: aarch64-unknown-linux-musl
            args: --out dist --zig
            interpreter: -i 3.10 3.14t
            abi3t: true
          - os: ubuntu-latest
            manylinux: musllinux_1_2
            target: riscv64gc-unknown-linux-musl
            args: --out dist --zig
            interpreter: -i 3.10 3.14t
            abi3t: true

          # macOS
          - os: macos-latest
            manylinux: auto
            target: x86_64-apple-darwin
            args: --out dist
            interpreter: -i 3.10 3.14t
            abi3t: true
          - os: macos-latest
            manylinux: auto
            target: aarch64-apple-darwin
            args: --out dist
            interpreter: -i 3.10 3.14t pypy3.11 graalpy3.12
            abi3t: true

          # Windows
          - os: windows-latest
            manylinux: auto
            target: x86_64-pc-windows-msvc
            args: --out dist
            interpreter: -i 3.10 3.14t pypy3.11
            abi3t: true
          - os: windows-11-arm
            manylinux: auto
            target: aarch64-pc-windows-msvc
            args: --out dist
            interpreter: -i 3.10 3.14t
            abi3t: true

          # etc
          # - os: ubuntu-latest
          #   manylinux: ""
          #   target: wasm32-unknown-emscripten
          #   args: --out dist
          #   interpreter: ""
          #   abi3t: false
          #   envs:
          #     # https://pyodide.org/en/stable/development/abi.html
          #     EMSCRIPTEN_VERSION: "5.0.3"
          #     PYODIDE_PYTHON_VERSION: "3.14"
          #     PYODIDE_ABI_VERSION: "2026_0"
          - os: ubuntu-latest
            manylinux: ""
            target: x86_64-linux-android
            args: --out dist
            interpreter: ""
            abi3t: false
          - os: ubuntu-latest
            manylinux: ""
            target: aarch64-linux-android
            args: --out dist
            interpreter: ""
            abi3t: false

    defaults:
      run:
        shell: nu {0}

    steps:
      - uses: hustcer/setup-nu@v3
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Set environment variables
        if: ${{ matrix.envs }}
        run: |
          $env.VARS | from json | items { |key, value| $"($key)=($value)\n" | save -a $env.GITHUB_ENV }
        env:
          VARS: ${{ toJson(matrix.envs) }}

      - uses: emscripten-core/setup-emsdk@v16
        if: ${{ startsWith(matrix.target, 'wasm') }}
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          manylinux: ${{ matrix.manylinux }}
          target: ${{ matrix.target }}
          args: ${{ matrix.args }} ${{ matrix.interpreter }}

      - name: Build wheel (abi3t)
        uses: PyO3/maturin-action@v1
        if: ${{ matrix.abi3t }}
        with:
          manylinux: ${{ matrix.manylinux }}
          target: ${{ matrix.target }}
          args: ${{ matrix.args }} --features abi3t -i 3.15t

      # - name: abi3audit
      #   run: pipx run abi3audit --report dist/*.whl | jq

      - name: Github summary
        run: |
          "## ${{ matrix.target }}\n\n" | save -a $env.GITHUB_STEP_SUMMARY
          "| name | size |\n| --- | --- |\n" | save -a $env.GITHUB_STEP_SUMMARY
          ls dist | each { |row| $"| ($row.name | path basename) | ($row.size) |\n" | save -a $env.GITHUB_STEP_SUMMARY }

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ strategy.job-index }}
          path: ./dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nu {0}
    steps:
      - uses: hustcer/setup-nu@v3
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Build sdist
        run: uv build --sdist

      - run: ls dist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: ./dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - wheel
      - sdist
    environment: publish
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - run: ls dist

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
